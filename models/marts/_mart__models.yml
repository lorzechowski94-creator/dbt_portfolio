    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, assessment_id]
    columns:
      - name: source
        description: Tenant token of the source schema the row came from. Opens the grain.
        tests: [not_null]
      - name: assessment_key
        description: source_key(source, assessment_id) — unique on its own; keep it in the table visual so equal rows never merge.
        tests: [unique, not_null]
      - name: assessment_id
        description: >
          Assessment primary key (assessment.id). Grain WITH source — the id is
          allocated per care and repeats across them.
        tests: [not_null]
      - name: assessment_type_id
        description: Assessment type id (assessment.assessmentId).
        tests: [not_null]
      - name: assessment_type_name
        description: The report's Assessment Name column — the type's current name, the Assessment slicer value.
      - name: is_assessment_type_deleted
        description: The type is deleted. Its assessments are listed anyway, as on the legacy page.
      - name: assessment_name
        description: The name the assessment was saved with (assessment.name). Not on the legacy page.
      - name: client_id
        description: client.id, the client assessed. Not unique on its own.
        tests: [not_null]
      - name: client_key
        description: source_key(source, client_id) — the same value as mart__dim_client's key.
        tests: [not_null]
      - name: first_name
        description: First name (fname).
      - name: surname
        description: Surname (sname).
      - name: full_name
        description: The report's Client column — first name + surname.
      - name: client_state_id
        description: The client's state — 1 Active, 2 Pending, 3 Archived.
      - name: client_state
        description: The report's Status — Active / Pending / Archived, also the colour of the name.
      - name: area_id
        description: >
          The client's area id (client.area as a number). Branch-level RLS key: the
          TenantArea role keeps rows whose area belongs to one of the admin's
          allowed workgroups (see mart__area_scope), and hides a row without one
          under an area limit, as the page does.
      - name: area_name
        description: The report's Area column; null when the client has no area or no area row holds it.
      - name: workgroup_names
        description: >

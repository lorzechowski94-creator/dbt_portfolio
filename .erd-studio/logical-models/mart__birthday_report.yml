name: mart__birthday_report
schema: care_management
description: Birthday Report. One row per person (client or carer) with a usable date of birth; flat list, no aggregation and no totals row. Ports birthday.php.
grain: One row per source + person_key (person_type + person_id)
modelRole: domain-dim
rationale:
  purpose: A flat person list, not an aggregate — the report shows rows, never measures.
  roleChoice: Stands alone in the star. A row is EITHER a client or a carer, so it relates to neither dimension, and its date window is a Power BI filter over next_birthday_date rather than a dim_date join. That filter wraps across 31 December, unlike the source's dateFrom/dateTo.
  design: Person type and state are slicers (person_type_label, state) rather than the source's GET parameters. Date-relative columns (days_to_go, age_years) are evaluated at build time; date_of_birth, birth_month and birth_day are stable if a same-day figure is needed in DAX. Column semantics are documented on int__birthday_people.
columns:
  - name: source
    dataType: VARCHAR
    description: Tenant token of the source schema the row came from. Opens the grain.
    isNaturalKey: true
  - name: person_key
    dataType: NUMBER(38,0)
    description: Surrogate key, care, person type and id in one integer — source_code * 10^13 + (1 client, 2 carer) * 10^12 + person_id. Unique on its own.
    isPrimaryKey: true
  - name: person_type
    dataType: VARCHAR
    description: "'client' or 'carer'."
  - name: person_type_label
    dataType: VARCHAR
    description: Display form of person_type — Client / Carer. The report's Type column.
  - name: person_id
    dataType: NUMBER(38,0)
    description: client.id or carer.id. Not unique on its own.
  - name: title
    dataType: VARCHAR
    description: Salutation; often blank.
  - name: first_name
    dataType: VARCHAR
    description: First name (fname).
  - name: surname
    dataType: VARCHAR
    description: Surname (sname).
  - name: full_name
    dataType: VARCHAR
    description: The report's Name column — title + first name + surname.
  - name: date_of_birth
    dataType: DATE
    description: Date of birth, bounded to 1900-01-01 .. build date.
  - name: birth_month
    dataType: NUMBER(38,0)
    description: Month of birth (1-12).
  - name: birth_day
    dataType: NUMBER(38,0)
    description: Day of month of birth (1-31).
  - name: birthday_this_year
    dataType: DATE
    description: Anniversary in the current calendar year; may be in the past.
  - name: next_birthday_date
    dataType: DATE
    description: Next anniversary on or after the build date — the report's date filter.
  - name: days_to_go
    dataType: NUMBER(38,0)
    description: The report's Days To Go value; 0 = today, never negative. Default sort, ascending.
  - name: days_to_go_label
    dataType: VARCHAR
    description: Display text for days_to_go.
  - name: age_years
    dataType: NUMBER(38,0)
    description: The report's Years Old column — age as at the build date, not at the upcoming birthday.
  - name: age_at_next_birthday
    dataType: NUMBER(38,0)
    description: Age reached on next_birthday_date.
  - name: gender
    dataType: VARCHAR
    description: The report's Gender column (sex), free text in the source.
  - name: email
    dataType: VARCHAR
    description: Email address; null when blank.
  - name: area_id
    dataType: NUMBER(38,0)
    description: "The person's own area id (client.area or carer.area as a number). Branch-level RLS key: the TenantArea role keeps rows whose area belongs to one of the admin's allowed workgroups (mart__area_scope)."
  - name: area_name
    dataType: VARCHAR
    description: The report's Area column; falls back to the raw area id (client.area / carer.area) when unmapped.
  - name: workgroup
    dataType: VARCHAR
    description: Comma-joined workgroup names for the area.
  - name: branch
    dataType: VARCHAR
    description: Comma-joined branch names for the area.
  - name: state_id
    dataType: NUMBER(38,0)
    description: Raw state code — 1 Active, 2 Pending, 3 Archived.
  - name: state
    dataType: VARCHAR
    description: The report's State column — Active / Pending / Archived.
  - name: company_id
    dataType: NUMBER(38,0)
    description: Company key. RLS key (with location_id).
  - name: location_id
    dataType: NUMBER(38,0)
    description: Location key. RLS key (with company_id).

                severity: warn
      - name: company_id
        description: Company key (cmSkinAssessments.companyId). RLS key (with location_id).
        tests: [not_null]
      - name: location_id
        description: >
          Location key (cmSkinAssessments.locationId, else the client's location).
          RLS key (with company_id).
        tests: [not_null]

  - name: mart__task_review_report
    description: >
      FACT/DETAIL — Task Review. One row per scheduled task slot per day per result
      recorded on it, full history plus a 60-day forward look
      (macros/report_horizon.sql): a slot with nothing recorded is one blank row, a
      slot with several results one row each, as on the legacy Digital Task Review
      page (companyTaskRpt.php). A future slot is a forecast of the schedule at
      build time. No totals on the page. Count slots on is_latest_for_slot, which
      marks one row per slot. Which schedules, dates and results make a row, and
      where it departs from the page, is documented on int__task_review. Names are
      on the row only where they belong to the result (status, sub status, who
      recorded it): relate client_key to mart__dim_client, task_schedule_key to
      mart__dim_task_schedule and scheduled_date to mart__dim_date. Incremental
      (delete+insert on scheduled_date): each run replaces every date from 60 days
      back up to the horizon, so a forecast slot whose schedule has since changed
      does not survive. Power BI setup: docs/powerbi_task_review_setup.md.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, task_assign_id, task_assign_times_id, scheduled_date, result_number]
    columns:
      - name: source
        description: Tenant token of the source schema the row came from. Opens the grain.
        tests: [not_null]
      - name: scheduled_date
        description: The date the slot is due — the page's Date. Part of the grain; relate to mart__dim_date.
        tests: [not_null]
      - name: task_assign_id
        description: The schedule (cmdailyTasksAssign.id). Part of the grain WITH source.
        tests: [not_null]
      - name: task_schedule_key
        description: Power BI relationship key to mart__dim_task_schedule — source_key(source, task_assign_id).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart__dim_task_schedule')
                field: task_schedule_key
      - name: task_assign_times_id
        description: The slot's time (cmdailyTasksAssignTimes.id); null for an "Any" slot. Part of the grain.
      - name: assigned_time
        description: The page's Assigned Time — "HH:MM", or 'Any'. Never the time period name (timePeriods is not loaded).
      - name: assigned_time_minutes
        description: Sort key for assigned_time — minutes after midnight, -1 for 'Any'.
      - name: time_period_id
        description: cmdailyTasksAssignTimes.timePeriodId; no name for it until timePeriods is loaded.
      - name: result_id
        description: The result (cmdailyTasksResults.id); null on the blank row of a slot with nothing recorded.
      - name: result_number
        description: 1, 2, ... in the order the slot's results were created; null on a blank row. Part of the grain.
      - name: is_latest_for_slot
        description: >
          True on exactly one row per slot: its most recent result, or its blank
          row. Every slot count and every "outcome of the slot" figure filters on it.
        tests: [not_null]
      - name: is_recorded
        description: True when the row carries a result; false only on the blank row of a slot with nothing recorded.
        tests: [not_null]
      - name: status_id
        description: >
          cmdailyTasksResults.taskDone: 1 Completed, 2 Other, 3 Partially Completed,
          4 Not Completed, 5 Missed, 6 Due, 7 Cancelled (the global statuses, DEV
          care1). 5 and 6 are written by the app, not by a carer.
      - name: status_name
        description: >
          The page's Status — the status name, or the company's own live name for it
          in the location. Null for a result whose status no category holds.
      - name: sub_status_id
        description: cmdailyTasksResults.subTaskDone.
      - name: sub_status_name
        description: The page's Sub Status (cmdailyTasksReason.name).
      - name: recorded_by_id
        description: cmdailyTasksResults.createdBy.
      - name: recorded_by
        description: >
          The page's Carer column — the name of carer row createdBy, office users and
          deleted carers included, which is why it is on the row and not a key to
          mart__dim_carer (care workers who are not deleted only). Null when no
          carer row has that id.
      - name: time_recorded
        description: The page's Time Recorded (timeSaid), "HH:MM:SS".
      - name: comment
        description: The page's Comment.
      - name: result_created_at
        description: The page's Result Created (cmdailyTasksResults.created).
      - name: client_id
        description: The schedule's client (cmdailyTasksAssign.clientId).
        tests: [not_null]
      - name: client_key
        description: >
          Power BI relationship key to mart__dim_client — source_key(source,
          client_id). The Client column and the Area / Work Group / Branch columns
          come from there.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart__dim_client')
                field: client_key
      - name: area_id
        description: >
          The client's area (client.area as a number). Branch-level RLS key: the
          TenantArea role keeps rows whose area belongs to one of the admin's
          allowed workgroups (see mart__area_scope), and hides a row without one
          under an area limit. The page itself limits no rows by area.
      - name: location_key
        description: >
          Relationship key to mart__dim_location — source_key(source, location_id).
          A WARNING when it misses, as on mart__plans_taken_report.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart__dim_location')
                field: location_key
              config:
                severity: warn
      - name: company_id
        description: The schedule's company (cmdailyTasksAssign.companyId). RLS key (with location_id).
        tests: [not_null]
      - name: location_id
        description: The schedule's location (cmdailyTasksAssign.locationId), the one the page lists. RLS key (with company_id).
        tests: [not_null]

  - name: mart__dim_task_schedule
    description: >
      DIMENSION — one row per task schedule (cmdailyTasksAssign): the task it is
      for (cmdailyTasks) and how it is scheduled. Relate to
      mart__task_review_report on task_schedule_key; it holds the Task slicer and
      the page's Task column. The same schedules int__task_review expands: live,
      with a company, a location and a task row, of a client that is not deleted.
      Schedule grain rather than task grain, so that the fact needs one key and the
      schedule's own pattern and dates sit next to the task name.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, task_assign_id]
    columns:
      - name: source
        description: Tenant token of the source schema the row came from. Opens the grain.
        tests: [not_null]
      - name: task_assign_id
        description: cmdailyTasksAssign.id. Grain WITH source — the id is allocated per care.
        tests: [not_null]
      - name: task_schedule_key
        description: source_key(source, task_assign_id) — the relationship key.
        tests: [unique, not_null]
      - name: client_id
        description: The client the schedule is for (cmdailyTasksAssign.clientId).
      - name: client_key
        description: source_key(source, client_id).
      - name: task_id
        description: cmdailyTasksAssign.cmdailyTasksId, the task type.
      - name: task_name
        description: The page's Task column (cmdailyTasks.name).
      - name: is_task_deleted
        description: >
          The task type is deleted (cmdailyTasks.deleted). Its schedules still show,
          as on the page.
      - name: is_mandatory
        description: cmdailyTasksAssign.mandatory = 1, as stored. Not on the page.
      - name: schedule_pattern
        description: >
          How the schedule repeats, as text: Once, Weekly: Mon, Wed ..., Every N
          weeks: ..., Daily, or Every N days. Not on the page.
      - name: date_start
        description: cmdailyTasksAssign.dateStart.
      - name: date_finish
        description: cmdailyTasksAssign.dateFinish; null for an open-ended schedule.
      - name: stopped_at
        description: cmdailyTasksAssign.stoppedDate. Informational — it ends no slots, as on the page.
      - name: stop_reason
        description: cmdailyTasksAssign.reasonStop.
      - name: location_key
        description: source_key(source, location_id).
      - name: company_id
        description: The schedule's company. RLS key (with location_id).
        tests: [not_null]
      - name: location_id
        description: The schedule's location. RLS key (with company_id).
        tests: [not_null]

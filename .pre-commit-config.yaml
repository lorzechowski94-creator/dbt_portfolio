# Run `pre-commit install` once after `pip install pre-commit`.
# Then every `git commit` lints (and optionally fixes) staged SQL.
# Uses the jinja templater (see .sqlfluff) — no dbt / warehouse needed.
repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.1
    hooks:
      - id: sqlfluff-lint
      # Uncomment to auto-fix on commit instead of only reporting:
      # - id: sqlfluff-fix

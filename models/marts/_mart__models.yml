          from the same mapping as Plans Taken (int__area_workgroup_branch). Display
          only.
      - name: branch_names
        description: The report's Branch column — the live branches of those workgroups, comma-joined. Display only.
      - name: assessment_date
        description: The report's Assessment Date column — the date the assessment was done.
      - name: next_assessment_date
        description: >
          The report's Next Assessment Date column, when the next one is due.
          Relationship to mart__dim_date: the page's window. Some dates lie past
          the end of the calendar table (typed years up to 2064); a date filter
          drops those rows.
      - name: note
        description: The report's Note column.
      - name: is_latest_of_type
        description: >
          The client's newest assessment of this type. Not on the legacy page; the
          filter behind a "still due" figure (see int__assessments).
      - name: location_key
        description: >
          Relationship key to mart__dim_location — source_key(source, location_id).
          A WARNING when it misses, as on mart__plans_taken_report: 6 care2
          assessments on R2 PROD point at a location with no row.
        tests:

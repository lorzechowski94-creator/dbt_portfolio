name: mart__assessments_report
schema: care_management
description: "Assessments. One row per live assessment of a client (assessment), full history; flat list, no aggregation and no totals row. The Assessments tab of plansAssesmentRpt.php (Plan & Assessment Dates), whose Plans tab is mart__plans_taken_report and whose Wound / Skin tab is mart__skin_assessments_report."
grain: "One row per source + assessment_id (assessment_key)"
modelRole: transaction-fact
rationale:
  purpose: "The legacy tab's list of assessments due in a date window, with every column it can show, for all dates and every client state at once."
  roleChoice: "A transaction fact: one row per assessment done for a client, rebuilt in full each run. It relates to mart__dim_date once, on next_assessment_date (the page's window), and to mart__dim_location; the client's name and state are on the row, so it relates to no person dimension, as mart__plans_taken_report does."
  grainChoice: "The page lists one row per assessment and does not de-duplicate: a redone assessment keeps its old row and next date. is_latest_of_type marks the client's newest assessment of each type instead of dropping the others."
  design: "The page's From / To window applies to next_assessment_date and its Status is client_state. One rule for every viewer: the client exists and is not deleted, and the type exists (deleted types kept, as on the page). Column semantics and the row set are documented on int__assessments."
columns:
  - name: source
    dataType: "VARCHAR"
    description: "Tenant token of the source schema the row came from. Opens the grain."
    isNaturalKey: true
  - name: assessment_key
    dataType: "NUMBER(38,0)"
    description: "source_key(source, assessment_id) — unique on its own."
    isPrimaryKey: true
  - name: assessment_id
    dataType: "NUMBER(38,0)"
    description: "Assessment primary key (assessment.id). Grain WITH source — the id is allocated per care and repeats across them."
    isNaturalKey: true
  - name: assessment_type_id
    dataType: "NUMBER(38,0)"
    description: "Assessment type id (assessment.assessmentId)."
  - name: assessment_type_name
    dataType: "VARCHAR"
    description: "The report's Assessment Name column — the type's current name, the Assessment slicer value."
  - name: is_assessment_type_deleted
    dataType: "BOOLEAN"
    description: "The type is deleted. Its assessments are listed anyway, as on the legacy page."
  - name: assessment_name
    dataType: "VARCHAR"
    description: "The name the assessment was saved with (assessment.name). Not on the legacy page."
  - name: client_id
    dataType: "NUMBER(38,0)"
    description: "client.id, the client assessed. Not unique on its own."
  - name: client_key
    dataType: "NUMBER(38,0)"
    description: "source_key(source, client_id) — the same value as mart__dim_client's key."
  - name: first_name
    dataType: "VARCHAR"
    description: "First name (fname)."
  - name: surname
    dataType: "VARCHAR"
    description: "Surname (sname)."
  - name: full_name
    dataType: "VARCHAR"
    description: "The report's Client column — first name + surname."
  - name: client_state_id
    dataType: "NUMBER(38,0)"
    description: "The client's state — 1 Active, 2 Pending, 3 Archived."
  - name: client_state
    dataType: "VARCHAR"
    description: "The report's Status — Active / Pending / Archived."
  - name: area_id
    dataType: "NUMBER(38,0)"
    description: "The client's area id. Branch-level RLS key for the TenantArea role (mart__area_scope)."
  - name: area_name
    dataType: "VARCHAR"
    description: "The report's Area column."
  - name: workgroup_names
    dataType: "VARCHAR"
    description: "The report's Work Group column — the area's live workgroups, comma-joined (int__area_workgroup_branch). Display only."
  - name: branch_names
    dataType: "VARCHAR"
    description: "The report's Branch column — the live branches of those workgroups, comma-joined. Display only."
  - name: assessment_date
    dataType: "DATE"
    description: "The report's Assessment Date column — the date the assessment was done."
  - name: next_assessment_date
    dataType: "DATE"
    description: "The report's Next Assessment Date column — the date relationship, the page's window."
    isForeignKey: true
  - name: note
    dataType: "VARCHAR"
    description: "The report's Note column."
  - name: is_latest_of_type
    dataType: "BOOLEAN"
    description: "The client's newest assessment of this type. Not on the legacy page."
  - name: location_key
    dataType: "NUMBER(38,0)"
    description: "Relationship key to mart__dim_location — source_key(source, location_id)."
    isForeignKey: true
  - name: company_id
    dataType: "NUMBER(38,0)"
    description: "Company key (assessment.companyId). RLS key (with location_id)."
  - name: location_id
    dataType: "NUMBER(38,0)"
    description: "Location key (assessment.locationId). RLS key (with company_id)."

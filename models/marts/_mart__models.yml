  - name: mart__assessments_report
    description: >
      FACT/DETAIL — Assessments. One row per live assessment of a client
      (assessment), full history; flat list, no aggregation and no totals row.
      The Assessments tab of Plan & Assessment Dates (plansAssesmentRpt.php),
      whose Plans tab is mart__plans_taken_report and whose Wound / Skin tab is
      mart__skin_assessments_report. The page's From / To window applies to
      next_assessment_date, so relate that to mart__dim_date; its Status is
      client_state. Listed as on the page, not de-duplicated: is_latest_of_type
      marks the client's newest assessment of each type. Column semantics and the

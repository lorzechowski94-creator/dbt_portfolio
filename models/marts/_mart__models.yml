  - name: mart__bridge_carer_workgroup
    description: >
      BRIDGE — one row per carer of mart__all_carers_report and each live
      workgroup of their area, with the workgroup's live branch where it has one
      (int__area_workgroup_branch). An area can sit in several workgroups, so a
      carer can have several rows, and this is a bridge, not a column. Power BI:
      relate bridge[carer_key] *:1 all_carers[carer_key] with cross-filter BOTH
      and slice on branch_name and workgroup_name, as for the tag bridge; leave
      the blank branch out of the Branch slicer. A carer matches a workgroup when
      their area sits in it, and a branch when their area sits in one of its
      workgroups. Same rule as mart__bridge_client_workgroup (decided 2026-10-27):
      a workgroup with no live branch is kept, with a blank branch, although the
      carer page's Workgroup filter offers only the workgroups of the picked
      branches. A carer whose area is in no live workgroup (or who has no area)
      has no row, so any Branch or Workgroup pick hides them. CARER GRAIN ON
      PURPOSE, not area grain: the carer table's RLS (TenantArea included) then
      flows down this relationship, so a restricted admin's slicers list only
      their own branches, and all_carers_sv can count carers per branch on it,
      which a semantic view cannot do through an area-grain bridge.
      mart__area_scope keeps the links as ids for the TenantArea role and also
      keeps links this bridge drops (deleted workgroups or branches); it must not
      be swapped for this table.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, carer_id, workgroup_id, branch_id]
    columns:
      - name: source
        description: Tenant token of the source schema the row came from. Opens the grain.
        tests: [not_null]
      - name: carer_id
        description: Carer key. Grain with source + workgroup_id + branch_id. Power BI relates on carer_key.
        tests: [not_null]
      - name: carer_key
        description: Relationship key to mart__all_carers_report — source_key(source, carer_id).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart__all_carers_report')
                field: carer_key
      - name: workgroup_id
        description: Workgroup id (cmLevelAreaWorkgroup.workgroupId).
        tests: [not_null]
      - name: workgroup_name
        description: Workgroup name (cmLevelWorkgroup.name) — the Workgroup slicer value.
      - name: branch_id
        description: Branch id (cmLevelWorkgroupBranch.branchId); null for a workgroup with no live branch.
      - name: branch_name
        description: Branch name (cmLevelBranch.name) — the Branch slicer value; null with branch_id. Not the location.
      - name: company_id
        description: Company key, from the carer. RLS key (with location_id).
      - name: location_id
        description: Location key, from the carer. RLS key (with company_id).

  - name: mart__all_clients_report
    description: >
      FACT/DETAIL — All Clients. One row per client the legacy All Clients page
      lists (Active, Pending and Archived clients), whatever their area, workgroup
      or branch, as on the page; flat list, no dates, no totals.
      Ports clientsTotalAll.php / clientsTotalAllTableBc.php. The page's tab is the
      state slicer; its Branch and Workgroup filters work through
      mart__bridge_client_workgroup, its Tags filter through mart__bridge_client_tag
      and its Job Type search through mart__bridge_client_job_type, all related on
      client_key. Location names come from mart__dim_location on location_key.
      Also the base of all_clients_sv (macros/create_semantic_views.sql). Stands
      apart from mart__dim_client, which keeps every client of the client table
      (no state rule) for the hours facts. Column semantics, the legacy quirks and
      the area handling are documented on int__all_clients.
      Full table rebuild each run.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, client_id]
    columns:
      - name: source
        description: Tenant token of the source schema the row came from. Opens the grain.
        tests: [not_null]
      - name: client_key
        description: >
          source_key(source, client_id) — unique on its own, the "one" side of the
          relationships from the three client bridges. Same value as
          mart__dim_client's key for the same client.
        tests: [unique, not_null]
      - name: client_id
        description: >
          Client primary key (client.id). Grain WITH source — the id is allocated
          per care and repeats across them.
        tests: [not_null]
      - name: client_no
        description: The report's No. column (residentId).
      - name: has_private_note
        description: Private-note warning icon in front of No. (client.privateNote = 1).
      - name: has_future_status_change
        description: Future-status icon in front of No. — a status change still to run.
      - name: first_name
        description: First name (fname).
      - name: surname
        description: Surname (sname); the legacy Name column sorts by it.
      - name: full_name
        description: The report's Name column — first name + surname.
      - name: gender
        description: The report's Gender column — Female / Male (F / M, 2 / 1, or the word), null for any other code.
      - name: address
        description: The report's Address column — address line 1, town, county, post code, blanks skipped.
      - name: address_line_1
        description: Address line 1 (client.currentAddress1); with town, what the Address search matches.
      - name: town
        description: Town (client.currentTown).
      - name: county
        description: The report's County column.
      - name: post_code
        description: The report's Post Code column.
      - name: is_location_confirmed
        description: False when the client has no latitude — the "Location not confirmed" marker.
      - name: branch_names
        description: The report's Branch column, comma-joined; null when the area reaches no live branch. Filter through mart__bridge_client_workgroup.
      - name: workgroup_names
        description: The report's Workgroup column, comma-joined, workgroups with no branch included; null when none. Filter through mart__bridge_client_workgroup.
      - name: area_id
        description: >
          The client's area id (client.area as a number); null when the client has
          no area. Branch-level RLS key: the TenantArea role keeps rows whose area
          belongs to one of the admin's allowed workgroups (see mart__area_scope),
          so a null is hidden under an area limit, as on the page.
      - name: area_name
        description: The report's Area column; null when no area row holds that id.
      - name: email
        description: The report's E-mail column.
      - name: phone
        description: The report's Phone column — home and mobile, blanks skipped.
      - name: phone_home
        description: Home phone; with phone_mobile, what the Phone search matches.
      - name: phone_mobile
        description: Mobile phone.
      - name: date_of_birth
        description: The report's DOB column.
      - name: job_types
        description: The report's Job Type column, comma-joined in the client's list order, deleted job types included. Filter through mart__bridge_client_job_type (live ones only).
      - name: tags
        description: The report's Tags column, comma-joined in tag category order. Filter through mart__bridge_client_tag.
      - name: status_id
        description: Status key (client.statusId as a number).
      - name: status
        description: The report's Status column (status.type).
      - name: status_colour
        description: >
          Status colour (status.colour), a Bootstrap 3 context class (info, danger,
          primary, success, warning), not a colour code. Map it before using it for
          conditional formatting.
      - name: status_change_at
        description: >
          The report's Status Change column — when the latest status change was
          recorded, as TIMESTAMP_NTZ (the value as loaded, without a time zone).
      - name: status_comment
        description: The report's Comment column — the note of the latest status change.
      - name: first_contact_date
        description: The report's first contact column (admissionDate); the legacy header is the company's own label.
      - name: service_commenced_date
        description: The report's service commenced column (inductionDate); the legacy header is the company's own label.
      - name: council_id
        description: The report's Council Id column.
      - name: state_id
        description: Raw state code — 1 Active, 2 Pending, 3 Archived.
      - name: state
        description: The report's state — Active / Pending / Archived (the legacy tabs).
      - name: location_key
        description: >
          Relationship key to mart__dim_location — source_key(source, location_id).
          A WARNING when it misses, as on mart__all_carers_report: client.location
          is not constrained in the source, and such a client just has no location
          name.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart__dim_location')
                field: location_key
              config:
                severity: warn
      - name: company_id
        description: Company key (client.companyId). RLS key (with location_id).
      - name: location_id
        description: Location key (client.location). RLS key (with company_id).

  - name: mart__bridge_client_tag
